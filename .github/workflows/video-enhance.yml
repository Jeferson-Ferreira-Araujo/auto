name: video-enhance

# Worker de melhoria de vídeo para Reels.
# Disparado sob demanda pela app (repository_dispatch), com fallback agendado.

on:
  repository_dispatch:
    types: [video-enhance]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: video-enhance
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install worker deps
        working-directory: scripts/video-worker
        run: npm install --no-audit --no-fund

      - name: Process pending jobs
        working-directory: scripts/video-worker
        env:
          WORKER_DB_URL: ${{ secrets.WORKER_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: npx tsx index.ts
